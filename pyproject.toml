[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "borgnet-universal-interface"
version = "0.1.0"
description = "A local-first glass workspace for your models, computers, APIs, and shared MCP context."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "mcp>=1.20,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
borgnet = "borgnet.__main__:main"

[tool.setuptools.package-data]
borgnet = ["web/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["borgnet*"]
